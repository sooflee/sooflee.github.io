<!doctype html>
<!-- Nothing to see here -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>bwang</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #ffffff;
        overflow: hidden;
        overscroll-behavior: none;
    }
    canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
    }
</style>
</head>
<body>
<!-- Nothing to see here -->
<canvas id="tank"></canvas>
<script>
(function () {
    var canvas = document.getElementById('tank');
    var ctx = canvas.getContext('2d');

    var INK = '#cccccc';   // the tank's single tone
    var BG = '#ffffff';

    // Every block drawn is exactly CELL x CELL device pixels on an integer grid.
    var CELL = 8, COLS = 0, ROWS = 0, OX = 0, OY = 0;

    function rand(a, b) { return a + Math.random() * (b - a); }
    function irand(a, b) { return Math.floor(rand(a, b + 1)); }

    // ---------- sprites (# = black, . = empty) ----------
    var JELLY = [
        [
            "....#####....",
            "..#########..",
            ".###########.",
            "#############",
            "#############",
            "#############",
            "#.##.###.##.#"
        ],
        [
            ".....###.....",
            "...#######...",
            "..#########..",
            ".###########.",
            "#############",
            "#############",
            "##.##.#.##.##"
        ]
    ];
    var JELLY_ANCHORS = [2, 5, 7, 10];

    var FISH = [
        [
            "......###...",
            "#...########",
            "##.#########",
            "#########.##",
            "##.#########",
            "#...########",
            "......###..."
        ],
        [
            "......###...",
            "....########",
            "#..#########",
            "#########.##",
            "#..#########",
            "....########",
            "......###..."
        ]
    ];

    var ROCK = [
        "..###.",
        ".#####",
        "######",
        ".####."
    ];

    var jellies = [], fish = [], plants = [], gravel = [], bubbles = [];
    var rocks = [], falling = [];
    var nextRock = 0, disturb = 0, disturbX = 0;

    var FIRST_ROCK_MS = 8000;
    var ROCK_GAP_MS = [30000, 120000];

    function resize() {
        var dpr = Math.min(window.devicePixelRatio || 1, 3);
        var w = Math.floor(canvas.clientWidth * dpr);
        var h = Math.floor(canvas.clientHeight * dpr);
        canvas.width = w;
        canvas.height = h;

        var targetCols = canvas.clientWidth < 640 ? 82 : 150;
        CELL = Math.max(3, Math.round(w / targetCols));
        COLS = Math.floor(w / CELL);
        ROWS = Math.floor(h / CELL);
        OX = Math.floor((w - COLS * CELL) / 2);
        OY = Math.floor((h - ROWS * CELL) / 2);
        build();
    }

    function build() {
        var small = COLS < 100;
        var floor = ROWS - 2;
        var i;

        gravel = [];
        for (var c = 0; c < COLS; c++) {
            if (Math.random() < 0.5) gravel.push([c, floor + 1]);
            if (Math.random() < 0.12) gravel.push([c, floor]);
        }

        plants = [];
        var pCount = 4;
        for (i = 0; i < pCount; i++) {
            var px0 = Math.round((i + rand(0.28, 0.72)) * (COLS / pCount));
            px0 = Math.max(2, Math.min(COLS - 12, px0));
            var blades = 2;
            for (var b = 0; b < blades; b++) {
                plants.push({
                    x: px0 + b * irand(4, 7),
                    h: irand(Math.round(ROWS * 0.12), Math.round(ROWS * 0.22)),
                    phase: rand(0, Math.PI * 2),
                    speed: rand(0.03, 0.055),
                    waves: rand(2.4, 4.0),
                    bend: rand(1.5, 2.6)
                });
            }
        }

        var domeH = JELLY[0].length;
        jellies = [];
        var jCount = small ? 1 : 2;
        for (i = 0; i < jCount; i++) {
            var tail = small ? 6 : 8;
            var top = 1;
            var bottom = Math.max(top + 4, ROWS - domeH - tail - 6);
            jellies.push({
                x: Math.max(1, Math.min(COLS - JELLY[0][0].length - 1,
                    Math.round((i + rand(0.25, 0.75)) * (COLS / jCount)) - 6)),
                y: irand(top + 2, bottom),
                top: top,
                bottom: bottom,
                up: Math.random() < 0.5,
                tail: tail,
                phase: rand(0, Math.PI * 2),
                drift: Math.random() < 0.5 ? -1 : 1
            });
        }

        fish = [];
        var fCount = 3;
        for (i = 0; i < fCount; i++) {
            fish.push({
                x: rand(0, COLS),
                y: Math.round(rand(ROWS * 0.10, ROWS * 0.60)),
                dir: Math.random() < 0.5 ? -1 : 1,
                speed: rand(0.16, 0.38),
                phase: rand(0, Math.PI * 2),
                bob: rand(0.05, 0.12),
                dart: 0
            });
        }

        bubbles = [];
        rocks = [];
        falling = [];
        disturb = 0;
        nextRock = tick + Math.round(FIRST_ROCK_MS / STEP);
    }

    // ---------- grid drawing ----------
    function px(cx, cy) {
        if (cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS) return;
        ctx.fillRect(OX + cx * CELL, OY + cy * CELL, CELL, CELL);
    }

    // Each creature is stamped with a one-cell white gap around it, so
    // overlapping black silhouettes never fuse into a blob.
    function stamp(cells) {
        ctx.fillStyle = BG;
        for (var i = 0; i < cells.length; i += 2) {
            for (var dy = -1; dy <= 1; dy++) {
                for (var dx = -1; dx <= 1; dx++) px(cells[i] + dx, cells[i + 1] + dy);
            }
        }
        ctx.fillStyle = INK;
        for (var j = 0; j < cells.length; j += 2) px(cells[j], cells[j + 1]);
    }

    function spriteCells(out, rows, x, y, flip) {
        var w = rows[0].length;
        for (var r = 0; r < rows.length; r++) {
            var line = rows[r];
            for (var c = 0; c < w; c++) {
                if (line.charAt(c) === '#') out.push(x + (flip ? w - 1 - c : c), y + r);
            }
        }
    }

    function drawPlant(p, t) {
        var baseY = ROWS - 2;
        var cells = [];
        for (var k = 0; k < p.h; k++) {
            var u = k / p.h;
            var root = Math.min(1, k / 3);
            var shake = 0;
            if (disturb > 0 && Math.abs(p.x - disturbX) < 26) {
                shake = Math.sin(t * 0.8 + p.phase) * (disturb / 26) * 2.2 * u;
            }
            var off = Math.round(Math.sin(p.phase + u * p.waves + t * p.speed) * p.bend * root + shake);
            var w = u < 0.45 ? 3 : (u < 0.85 ? 2 : 1);
            for (var i = 0; i < w; i++) cells.push(p.x + off + i, baseY - k);
        }
        stamp(cells);
    }

    function drawJelly(j, t) {
        var f = Math.floor(t / 9 + j.phase) % 2;
        var rows = JELLY[f];
        var x = Math.round(j.x);
        var y = Math.round(j.y);
        var cells = [];
        spriteCells(cells, rows, x, y, false);

        var hemY = y + rows.length;
        for (var a = 0; a < JELLY_ANCHORS.length; a++) {
            var ax = x + JELLY_ANCHORS[a];
            var len = j.tail - (a % 2) - (f === 1 ? 1 : 0);
            for (var k = 0; k < len; k++) {
                var off = Math.round(Math.sin(t * 0.075 + j.phase + a * 1.3 + k * 0.5) * 1.4);
                cells.push(ax + off, hemY + k);
            }
        }
        stamp(cells);
    }

    function drawFish(f, t) {
        var frame = Math.floor(t / 5 + f.phase * 3) % 2;
        var y = Math.round(f.y + Math.sin(t * f.bob + f.phase) * 2);
        var cells = [];
        spriteCells(cells, FISH[frame], Math.round(f.x), y, f.dir < 0);
        stamp(cells);
    }

    // ---------- rocks ----------
    function bubbleAt(x, y, rate) {
        bubbles.push({ x: x, y: y, rate: rate, phase: rand(0, Math.PI * 2) });
    }

    // Where a rock dropped at column x comes to rest: on the substrate, or
    // stacked on top of whatever landed there before.
    function restingRow(x) {
        var h = ROCK.length, w = ROCK[0].length;
        var row = ROWS - 1 - h + 1;
        for (var i = 0; i < rocks.length; i++) {
            var r = rocks[i];
            if (x + w > r.x && r.x + w > x) row = Math.min(row, r.y - h);
        }
        return row;
    }

    function dropRock() {
        var x = irand(5, Math.max(6, COLS - 9));
        falling.push({ x: x, y: -ROCK.length, vy: 0.7 });

        // The splash startles nearby fish, which bolt the other way.
        var mid = FISH[0][0].length / 2;
        for (var i = 0; i < fish.length; i++) {
            var f = fish[i];
            var dx = (f.x + mid) - x;
            f.dir = dx >= 0 ? 1 : -1;
            f.dart = Math.abs(dx) < 48 ? 26 : 12;
        }

        disturb = 18;
        disturbX = x;
        for (var b = 0; b < 4; b++) bubbleAt(x + irand(-1, 2), irand(1, 5), irand(2, 4));
    }

    function updateRocks(t) {
        if (tick >= nextRock) {
            dropRock();
            nextRock = tick + Math.round(rand(ROCK_GAP_MS[0], ROCK_GAP_MS[1]) / STEP);
        }

        for (var i = falling.length - 1; i >= 0; i--) {
            var r = falling[i];
            r.vy = Math.min(5.5, r.vy + 0.5);
            r.y += r.vy;

            if (tick % 2 === 0 && r.y > 0) bubbleAt(Math.round(r.x) + irand(0, 3), Math.round(r.y), irand(2, 4));

            var rest = restingRow(Math.round(r.x));
            if (r.y >= rest) {
                falling.splice(i, 1);
                rocks.push({ x: Math.round(r.x), y: rest });
                if (rocks.length > 14) rocks.shift();
                disturb = 26;
                disturbX = Math.round(r.x);
                var mid2 = FISH[0][0].length / 2;
                for (var m = 0; m < fish.length; m++) {
                    var ff = fish[m];
                    var d2 = (ff.x + mid2) - r.x;
                    if (Math.abs(d2) < 34) { ff.dir = d2 >= 0 ? 1 : -1; ff.dart = 20; }
                }
                for (var k = 0; k < 9; k++) {
                    bubbleAt(Math.round(r.x) + irand(-2, 5), rest - irand(0, 3), irand(2, 4));
                }
            }
        }

        if (disturb > 0) disturb--;
    }

    function drawRock(x, y) {
        var cells = [];
        spriteCells(cells, ROCK, x, y, false);
        stamp(cells);
    }

    // ---------- loop ----------
    var tick = 0, last = 0;
    var STEP = 140; // ms per animation step -> chunky, pixel-art timing

    function frame(now) {
        requestAnimationFrame(frame);
        if (now - last < STEP) return;
        last = now;
        tick++;
        var t = tick;
        var i;

        ctx.fillStyle = BG;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = INK;

        for (i = 0; i < gravel.length; i++) px(gravel[i][0], gravel[i][1]);
        for (i = 0; i < plants.length; i++) drawPlant(plants[i], t);

        updateRocks(t);
        for (i = 0; i < rocks.length; i++) drawRock(rocks[i].x, rocks[i].y);
        for (i = 0; i < falling.length; i++) drawRock(Math.round(falling[i].x), Math.round(falling[i].y));

        if (Math.random() < 0.008 && bubbles.length < 3) {
            bubbleAt(irand(2, COLS - 3), ROWS - 3, 3);
        }
        ctx.fillStyle = INK;
        for (i = bubbles.length - 1; i >= 0; i--) {
            var b = bubbles[i];
            if (tick % b.rate === 0) b.y -= 1;
            if (b.y < 0) bubbles.splice(i, 1);
            else px(b.x + (Math.sin(t * 0.4 + b.phase) > 0 ? 0 : 1), b.y);
        }

        var fw = FISH[0][0].length;
        for (i = 0; i < fish.length; i++) {
            var f = fish[i];
            if (f.dart > 0) f.dart--;
            f.x += f.dir * f.speed * (f.dart > 0 ? 2.8 : 1);
            if (f.dir > 0 && f.x > COLS + 1) { f.x = -fw; f.y = Math.round(rand(ROWS * 0.10, ROWS * 0.60)); }
            if (f.dir < 0 && f.x < -fw - 1) { f.x = COLS + 1; f.y = Math.round(rand(ROWS * 0.10, ROWS * 0.60)); }
            drawFish(f, t);
        }

        // Jellyfish pulse upward, then sink back down. They stay inside the
        // tank -- never wrapping, so none ever appears out of the floor.
        for (i = 0; i < jellies.length; i++) {
            var j = jellies[i];
            if (j.up) {
                if (tick % 8 === 0) j.y -= 1;
                if (j.y <= j.top) j.up = false;
            } else {
                if (tick % 18 === 0) j.y += 1;
                if (j.y >= j.bottom) j.up = true;
            }
            if (tick % 40 === 0) j.x += j.drift;
            if (j.x < 1) j.drift = 1;
            if (j.x > COLS - JELLY[0][0].length - 1) j.drift = -1;
            drawJelly(j, t);
        }
    }

    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', resize);
    resize();
    requestAnimationFrame(frame);
})();
</script>
</body>
</html>
