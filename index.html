<!doctype html>
<!-- Nothing to see here -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>bwang</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #ffffff;
        overflow: hidden;
        overscroll-behavior: none;
    }
    canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
    }
</style>
</head>
<body>
<!-- Nothing to see here -->
<canvas id="tank"></canvas>
<script>
(function () {
    var canvas = document.getElementById('tank');
    var ctx = canvas.getContext('2d');

    var INK = '#cccccc';   // the tank's single tone
    var BG = '#ffffff';

    // Every block drawn is exactly CELL x CELL device pixels on an integer grid.
    var CELL = 8, COLS = 0, ROWS = 0, OX = 0, OY = 0;

    function rand(a, b) { return a + Math.random() * (b - a); }
    function irand(a, b) { return Math.floor(rand(a, b + 1)); }

    // ---------- sprites (# = black, . = empty) ----------
    // Each species is a pixel silhouette plus the water it prefers.
    var SPECIES = {
        tetra: {
            w: 12, h: 7, band: [0.08, 0.70], speed: [0.16, 0.38],
            bob: [0.05, 0.12], flap: 5, rush: 4.2,
            frames: [[
                "......###...",
                "#...########",
                "##.#########",
                "#########.##",
                "##.#########",
                "#...########",
                "......###..."
            ], [
                "......###...",
                "....########",
                "#..#########",
                "#########.##",
                "#..#########",
                "....########",
                "......###..."
            ]]
        },
        hatchet: {
            w: 11, h: 8, band: [0.04, 0.18], speed: [0.10, 0.24],
            bob: [0.04, 0.09], flap: 4, rush: 3.4,
            frames: [[
                ".##########",
                "#..########",
                "##.########",
                "#..######.#",
                ".##########",
                ".##########",
                "..########.",
                "...######.."
            ], [
                ".##########",
                "...########",
                "#..########",
                "##.######.#",
                "#.#########",
                ".##########",
                "..########.",
                "...######.."
            ]]
        },
        angel: {
            w: 10, h: 14, band: [0.24, 0.56], speed: [0.08, 0.18],
            bob: [0.03, 0.07], flap: 6, rush: 3.0,
            frames: [[
                "#.........",
                ".#........",
                ".##.......",
                "..###.....",
                "..#####...",
                ".########.",
                "##########",
                "#######.##",
                "##########",
                ".########.",
                "..#####...",
                "..###.....",
                ".##.......",
                "#........."
            ], [
                ".#........",
                ".##.......",
                "..##......",
                "..####....",
                ".######...",
                ".#########",
                "##########",
                "#######.##",
                "##########",
                ".#########",
                ".######...",
                "..####....",
                "..##......",
                ".#........"
            ]]
        },
        seahorse: {
            w: 6, h: 12, band: [0.58, 0.82], speed: [0.03, 0.09],
            bob: [0.05, 0.10], flap: 7, rush: 2.2,
            frames: [[
                ".###..",
                "####..",
                "##.###",
                ".####.",
                "..###.",
                ".####.",
                "..###.",
                "..###.",
                ".###..",
                ".##...",
                ".##...",
                ".####."
            ], [
                ".###..",
                "####..",
                "##.###",
                ".####.",
                "..###.",
                "..####",
                "..###.",
                ".###..",
                ".###..",
                "..##..",
                "..##..",
                ".####."
            ]]
        }
    };

    // Bottom dwellers: they crawl on the substrate rather than swim.
    var CRITTERS = {
        snail: {
            w: 9, h: 6, speed: [0.015, 0.035], flap: 20, rush: 1,
            frames: [[
                "..###....",
                ".#####.#.",
                "##.###.#.",
                "###.#####",
                "#########",
                ".########"
            ], [
                "..###....",
                ".#####.#.",
                "##.###..#",
                "###.#####",
                "#########",
                "..#######"
            ]],
            // Pulled into the shell: stalks gone, foot tucked up.
            hidden: [
                "..###....",
                ".#####...",
                "##.###...",
                "###.####.",
                "#######..",
                ".######.."
            ]
        },
        shrimp: {
            w: 10, h: 6, speed: [0.05, 0.13], flap: 4, rush: 6,
            frames: [[
                "..#####...",
                ".#######..",
                "#.#######.",
                "##.#####.#",
                ".#.#####..",
                "...#.#.#.."
            ], [
                "..#####...",
                "#.######..",
                "##.######.",
                "#.#######.",
                ".#.#####.#",
                "..#.#.#..."
            ]]
        }
    };

    // Rocks are generated per drop: ragged ellipses, a little smaller than a fish.
    function makeRock() {
        var w = irand(7, 10), h = irand(5, 7);
        var rows = [], cx = w / 2, cy = h / 2;
        for (var r = 0; r < h; r++) {
            var dy = (r + 0.5 - cy) / cy;
            var hw = cx * Math.sqrt(Math.max(0, 1 - dy * dy)) + rand(-0.7, 0.7);
            var line = '';
            for (var c = 0; c < w; c++) {
                line += Math.abs(c + 0.5 - cx) <= hw ? '#' : '.';
            }
            rows.push(line);
        }
        return { rows: rows, w: w, h: h };
    }

    var fish = [], critters = [], plants = [], gravel = [], bubbles = [];
    var rocks = [], falling = [];
    var nextRock = 0, disturb = 0, disturbX = 0;

    var FIRST_ROCK_MS = 8000;
    var ROCK_GAP_MS = [30000, 120000];

    function resize() {
        var dpr = Math.min(window.devicePixelRatio || 1, 3);
        var w = Math.floor(canvas.clientWidth * dpr);
        var h = Math.floor(canvas.clientHeight * dpr);
        canvas.width = w;
        canvas.height = h;

        var targetCols = canvas.clientWidth < 640 ? 100 : 185;
        CELL = Math.max(3, Math.round(w / targetCols));
        COLS = Math.floor(w / CELL);
        ROWS = Math.floor(h / CELL);
        OX = Math.floor((w - COLS * CELL) / 2);
        OY = Math.floor((h - ROWS * CELL) / 2);
        build();
    }

    function build() {
        var small = COLS < 120;
        var floor = ROWS - 2;
        var i;

        gravel = [];
        for (var c = 0; c < COLS; c++) {
            if (Math.random() < 0.5) gravel.push([c, floor + 1]);
            if (Math.random() < 0.12) gravel.push([c, floor]);
        }

        plants = [];
        var pCount = 4;
        for (i = 0; i < pCount; i++) {
            var px0 = Math.round((i + rand(0.28, 0.72)) * (COLS / pCount));
            px0 = Math.max(2, Math.min(COLS - 12, px0));
            var blades = 2;
            for (var b = 0; b < blades; b++) {
                plants.push({
                    x: px0 + b * irand(4, 7),
                    h: irand(Math.round(ROWS * 0.10), Math.round(ROWS * 0.19)),
                    phase: rand(0, Math.PI * 2),
                    speed: rand(0.03, 0.055),
                    waves: rand(2.4, 4.0),
                    bend: rand(1.5, 2.6)
                });
            }
        }

        fish = [];
        var roster = small
            ? ['tetra', 'angel', 'seahorse']
            : ['tetra', 'tetra', 'hatchet', 'angel', 'seahorse'];
        for (i = 0; i < roster.length; i++) {
            var sp = SPECIES[roster[i]];
            fish.push({
                sp: sp,
                x: rand(2, Math.max(3, COLS - sp.w - 2)),
                y: Math.round(rand(ROWS * sp.band[0], ROWS * sp.band[1])),
                dir: Math.random() < 0.5 ? -1 : 1,
                speed: rand(sp.speed[0], sp.speed[1]),
                phase: rand(0, Math.PI * 2),
                bob: rand(sp.bob[0], sp.bob[1]),
                drawY: 0,
                dart: 0,
                flee: 0,
                fleeT: 0,
                turnLock: 0
            });
        }

        critters = [];
        var kinds = ['snail', 'shrimp'];
        for (i = 0; i < kinds.length; i++) {
            var cs = CRITTERS[kinds[i]];
            critters.push({
                kind: kinds[i],
                sp: cs,
                x: rand(4, Math.max(5, COLS - cs.w - 4)),
                dir: Math.random() < 0.5 ? -1 : 1,
                speed: rand(cs.speed[0], cs.speed[1]),
                phase: rand(0, Math.PI * 2),
                hideT: 0,
                dartT: 0,
                turnLock: 0
            });
        }

        bubbles = [];
        rocks = [];
        falling = [];
        disturb = 0;
        nextRock = tick + Math.round(FIRST_ROCK_MS / STEP);
    }

    // ---------- grid drawing ----------
    function px(cx, cy) {
        if (cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS) return;
        ctx.fillRect(OX + cx * CELL, OY + cy * CELL, CELL, CELL);
    }

    // Each creature is stamped with a one-cell white gap around it, so
    // overlapping black silhouettes never fuse into a blob.
    function stamp(cells) {
        ctx.fillStyle = BG;
        for (var i = 0; i < cells.length; i += 2) {
            for (var dy = -1; dy <= 1; dy++) {
                for (var dx = -1; dx <= 1; dx++) px(cells[i] + dx, cells[i + 1] + dy);
            }
        }
        ctx.fillStyle = INK;
        for (var j = 0; j < cells.length; j += 2) px(cells[j], cells[j + 1]);
    }

    function spriteCells(out, rows, x, y, flip) {
        var w = rows[0].length;
        for (var r = 0; r < rows.length; r++) {
            var line = rows[r];
            for (var c = 0; c < w; c++) {
                if (line.charAt(c) === '#') out.push(x + (flip ? w - 1 - c : c), y + r);
            }
        }
    }

    function drawPlant(p, t) {
        var baseY = ROWS - 2;
        var cells = [];
        for (var k = 0; k < p.h; k++) {
            var u = k / p.h;
            var root = Math.min(1, k / 3);
            var shake = 0;
            if (disturb > 0 && Math.abs(p.x - disturbX) < 32) {
                shake = Math.sin(t * 0.8 + p.phase) * (disturb / 26) * 2.2 * u;
            }
            var off = Math.round(Math.sin(p.phase + u * p.waves + t * p.speed) * p.bend * root + shake);
            var w = u < 0.45 ? 3 : (u < 0.85 ? 2 : 1);
            for (var i = 0; i < w; i++) cells.push(p.x + off + i, baseY - k);
        }
        stamp(cells);
    }

    function updateCritters(t) {
        for (var i = 0; i < critters.length; i++) {
            var c = critters[i];
            var y = ROWS - 2 - c.sp.h;
            if (c.turnLock > 0) c.turnLock--;
            if (c.dartT > 0) c.dartT--;

            // Shoved out from under a rock that came to rest on top of it.
            if (blockedBy(c.x, y, c.sp.w, c.sp.h)) {
                var out = 0;
                for (var k = 0; k < rocks.length; k++) {
                    var rk = rocks[k];
                    if (c.x + c.sp.w > rk.x && rk.x + rk.w > c.x && y + c.sp.h > rk.y && rk.y + rk.h > y) {
                        out = ((c.x + c.sp.w) - rk.x) <= ((rk.x + rk.w) - c.x) ? -1 : 1;
                        break;
                    }
                }
                c.x = Math.max(1, Math.min(COLS - 1 - c.sp.w, c.x + out));
                c.dir = out || c.dir;
                c.hideT = Math.max(c.hideT, 6);
            }

            if (c.hideT > 0) {
                c.hideT--;
            } else {
                var rush = c.dartT > 0 ? c.sp.rush : 1;
                var step = c.dir * c.speed * rush;
                if (blockedBy(c.x + step, y, c.sp.w, c.sp.h)) {
                    if (c.turnLock <= 0) { c.dir = -c.dir; c.turnLock = 12; }
                    step = c.dir * c.speed * rush;
                    if (blockedBy(c.x + step, y, c.sp.w, c.sp.h)) step = 0;
                }
                c.x += step;
                if (c.x < 1) { c.x = 1; c.dir = 1; }
                if (c.x + c.sp.w > COLS - 1) { c.x = COLS - 1 - c.sp.w; c.dir = -1; }
            }

            var rows;
            if (c.hideT > 0 && c.sp.hidden) rows = c.sp.hidden;
            else rows = c.sp.frames[Math.floor(t / (c.dartT > 0 ? 2 : c.sp.flap) + c.phase * 3) % 2];
            var cells = [];
            spriteCells(cells, rows, Math.round(c.x), y, c.dir < 0);
            stamp(cells);
        }
    }

    function drawFish(f, t) {
        var frame = Math.floor(t / (f.dart > 0 ? 2 : f.sp.flap) + f.phase * 3) % 2;
        var cells = [];
        spriteCells(cells, f.sp.frames[frame], Math.round(f.x), f.drawY, f.dir < 0);
        stamp(cells);
    }

    // ---------- rocks ----------
    function bubbleAt(x, y, rate) {
        bubbles.push({ x: x, y: y, rate: rate, phase: rand(0, Math.PI * 2) });
    }

    // Where a rock dropped at column x comes to rest: on the substrate, or
    // stacked on top of whatever landed there before.
    function restingRow(x, w, h) {
        var row = ROWS - h;
        for (var i = 0; i < rocks.length; i++) {
            var r = rocks[i];
            if (x + w > r.x && r.x + r.w > x) row = Math.min(row, r.y - h);
        }
        return row;
    }

    // A landed rock is solid: fish turn around at it rather than swimming through.
    function blockedBy(x, y, fw, fh) {
        for (var i = 0; i < rocks.length; i++) {
            var r = rocks[i];
            if (x + fw > r.x && r.x + r.w > x && y + fh > r.y && r.y + r.h > y) return true;
        }
        return false;
    }

    // A fish bolts away from (rx, ry): horizontally first, with a vertical
    // kick so the whole tank visibly scatters.
    function startle(f, rx, ry, power) {
        var dx = (f.x + f.sp.w / 2) - rx;
        var dy = (f.drawY + f.sp.h / 2) - ry;
        // Directly underneath, keep going rather than flip-flopping each tick.
        if (Math.abs(dx) > 3) f.dir = dx >= 0 ? 1 : -1;
        if (Math.abs(dy) > 2) f.flee = dy >= 0 ? 1 : -1;
        f.dart = Math.max(f.dart, power);
        f.fleeT = Math.max(f.fleeT, power);
    }

    // The snail pulls into its shell; the shrimp flicks away backwards.
    function spook(c, rx, power) {
        if (c.kind === 'snail') {
            c.hideT = Math.max(c.hideT, power * 2);
        } else {
            var dx = (c.x + c.sp.w / 2) - rx;
            if (Math.abs(dx) > 3) c.dir = dx >= 0 ? 1 : -1;
            c.dartT = Math.max(c.dartT, power);
        }
    }

    function dropRock() {
        var shape = makeRock();
        var x = irand(4, Math.max(5, COLS - shape.w - 4));
        falling.push({ x: x, y: -shape.h, vy: 0.7, rows: shape.rows, w: shape.w, h: shape.h });

        // The splash startles the whole tank; fish near it bolt hardest.
        for (var i = 0; i < fish.length; i++) {
            var f = fish[i];
            startle(f, x + shape.w / 2, 0, Math.abs((f.x + f.sp.w / 2) - x) < 60 ? 26 : 14);
        }
        for (var cc = 0; cc < critters.length; cc++) spook(critters[cc], x + shape.w / 2, 14);

        disturb = 18;
        disturbX = x;
        for (var b = 0; b < 4; b++) bubbleAt(x + irand(-1, 2), irand(1, 5), irand(2, 4));
    }

    function updateRocks(t) {
        if (tick >= nextRock) {
            dropRock();
            nextRock = tick + Math.round(rand(ROCK_GAP_MS[0], ROCK_GAP_MS[1]) / STEP);
        }

        for (var i = falling.length - 1; i >= 0; i--) {
            var r = falling[i];
            r.vy = Math.min(5.5, r.vy + 0.5);
            r.y += r.vy;

            if (tick % 2 === 0 && r.y > 0) bubbleAt(Math.round(r.x) + irand(0, r.w), Math.round(r.y), irand(2, 4));

            // Anything the rock plunges past scatters out of its way.
            var rcx = r.x + r.w / 2, rcy = r.y + r.h / 2;
            for (var q = 0; q < fish.length; q++) {
                var ff2 = fish[q];
                var ddx = (ff2.x + ff2.sp.w / 2) - rcx, ddy = (ff2.drawY + ff2.sp.h / 2) - rcy;
                if (Math.abs(ddx) < 42 && Math.abs(ddy) < 32) startle(ff2, rcx, rcy, 24);
            }
            if (r.y > ROWS * 0.5) {
                for (var cq = 0; cq < critters.length; cq++) {
                    var cr = critters[cq];
                    if (Math.abs((cr.x + cr.sp.w / 2) - rcx) < 40) spook(cr, rcx, 20);
                }
            }

            var rest = restingRow(Math.round(r.x), r.w, r.h);
            if (r.y >= rest) {
                falling.splice(i, 1);
                rocks.push({ x: Math.round(r.x), y: rest, w: r.w, h: r.h, rows: r.rows });
                if (rocks.length > 14) dropOldestRock();
                disturb = 26;
                disturbX = Math.round(r.x);
                for (var m = 0; m < fish.length; m++) {
                    var ff = fish[m];
                    if (Math.abs((ff.x + ff.sp.w / 2) - r.x) < 50) startle(ff, r.x + r.w / 2, rest, 24);
                }
                for (var cm = 0; cm < critters.length; cm++) spook(critters[cm], r.x + r.w / 2, 22);
                for (var k = 0; k < 9; k++) {
                    bubbleAt(Math.round(r.x) + irand(-2, r.w + 2), rest - irand(0, 3), irand(2, 4));
                }
            }
        }

        if (disturb > 0) disturb--;
    }

    // Retire the oldest rock that nothing is resting on, so a pile never
    // loses the rock holding it up.
    function dropOldestRock() {
        for (var i = 0; i < rocks.length; i++) {
            var r = rocks[i], held = false;
            for (var j = 0; j < rocks.length; j++) {
                var o = rocks[j];
                if (o !== r && o.x + o.w > r.x && r.x + r.w > o.x && o.y < r.y) { held = true; break; }
            }
            if (!held) { rocks.splice(i, 1); return; }
        }
        rocks.shift();
    }

    function drawRock(r, x, y) {
        var cells = [];
        spriteCells(cells, r.rows, x, y, false);
        stamp(cells);
    }

    // ---------- loop ----------
    var tick = 0, last = 0;
    var STEP = 140; // ms per animation step -> chunky, pixel-art timing

    function frame(now) {
        requestAnimationFrame(frame);
        if (now - last < STEP) return;
        last = now;
        tick++;
        var t = tick;
        var i;

        ctx.fillStyle = BG;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = INK;

        for (i = 0; i < gravel.length; i++) px(gravel[i][0], gravel[i][1]);
        for (i = 0; i < plants.length; i++) drawPlant(plants[i], t);

        updateRocks(t);
        for (i = 0; i < rocks.length; i++) drawRock(rocks[i], rocks[i].x, rocks[i].y);
        for (i = 0; i < falling.length; i++) drawRock(falling[i], Math.round(falling[i].x), Math.round(falling[i].y));

        updateCritters(t);

        if (Math.random() < 0.008 && bubbles.length < 3) {
            bubbleAt(irand(2, COLS - 3), ROWS - 3, 3);
        }
        ctx.fillStyle = INK;
        for (i = bubbles.length - 1; i >= 0; i--) {
            var b = bubbles[i];
            if (tick % b.rate === 0) b.y -= 1;
            if (b.y < 0) bubbles.splice(i, 1);
            else px(b.x + (Math.sin(t * 0.4 + b.phase) > 0 ? 0 : 1), b.y);
        }

        for (i = 0; i < fish.length; i++) {
            var f = fish[i];
            var fw = f.sp.w, fh = f.sp.h;
            if (f.dart > 0) f.dart--;
            // The substrate is the floor: never let a fish dip into it.
            var maxDrawY = ROWS - 2 - fh;
            f.drawY = Math.min(maxDrawY, Math.round(f.y + Math.sin(t * f.bob + f.phase) * 2));

            // Lift clear immediately if a rock came to rest on top of a fish.
            for (var esc = 0; esc < 12 && blockedBy(f.x, f.drawY, fw, fh); esc++) { f.y -= 1; f.drawY -= 1; }

            if (f.turnLock > 0) f.turnLock--;
            var rush = f.dart > 0 ? f.sp.rush : 1;
            var step = f.dir * f.speed * rush;
            if (blockedBy(f.x + step, f.drawY, fw, fh)) {
                if (f.turnLock <= 0) { f.dir = -f.dir; f.turnLock = 12; }
                step = f.dir * f.speed * rush;
                if (blockedBy(f.x + step, f.drawY, fw, fh)) step = 0;
            }
            f.x += step;

            if (f.fleeT > 0) {
                f.fleeT--;
                var ny = Math.min(f.y + f.flee * 0.7, maxDrawY - 2);
                var nDraw = Math.round(ny + Math.sin(t * f.bob + f.phase) * 2);
                if (blockedBy(f.x, nDraw, fw, fh)) f.fleeT = 0;
                else f.y = ny;
            }
            f.y = Math.max(1, Math.min(maxDrawY - 2, f.y));
            // The screen is the tank: fish turn at the glass instead of wrapping.
            if (f.x < 1) { f.x = 1; f.dir = 1; }
            if (f.x + fw > COLS - 1) { f.x = COLS - 1 - fw; f.dir = -1; }
            drawFish(f, t);
        }

    }

    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', resize);
    resize();
    requestAnimationFrame(frame);
})();
</script>
</body>
</html>
