        overscroll-behavior: none;

        display: block;

        image-rendering: pixelated;
        image-rendering: crisp-edges;

<body>
<!-- Nothing to see here -->
<canvas id="tank"></canvas>
<script>
(function () {
    var canvas = document.getElementById('tank');
    var ctx = canvas.getContext('2d');

    var INK = '#cccccc';   // living things: fish, plants, crawlers
    var STONE = '#8a8a8a'; // rock and substrate, distinctly darker
    var ANGEL = '#e6cbad'; // the one splash of colour: a soft, greyed orange
    var BG = '#ffffff';

    // Every block drawn is exactly CELL x CELL device pixels on an integer grid.
    var CELL = 8, COLS = 0, ROWS = 0, OX = 0, OY = 0;
    var BED = 4;      // rows of solid substrate along the bottom
    var AIR = 14;     // rows of air above the waterline (room for a floating bag)
    var WATER = 14;   // row the water surface sits on
    var FLOOR = 0;    // first row of that substrate (everything rests on FLOOR - 1)
    var SWIM_FLOOR = 0; // swimming fish stay this far above it, clear of the crawlers
    var EMBED = 1;
    var CRAWL_CLEAR = 7; // headroom kept above the ground for bottom dwellers    // rows a rock settles into whatever it lands on

    function rand(a, b) { return a + Math.random() * (b - a); }
    function irand(a, b) { return Math.floor(rand(a, b + 1)); }

    // ---------- sprites (# = black, . = empty) ----------
    // Each species is a pixel silhouette plus the water it prefers.
    var SPECIES = {
        tetra: {
            shoal: true, bobAmp: 1,
            w: 12, h: 7, band: [0.08, 0.70], speed: [0.16, 0.38],
            bob: [0.05, 0.12], flap: 5, rush: 4.2,
            frames: [[
                "......###...",
                "#...########",
                "##.#########",
                "#########.##",
                "##.#########",
                "#...########",
                "......###..."
            ], [
                "......###...",
                "....########",
                "#..#########",
                "#########.##",
                "#..#########",
                "....########",
                "......###..."
            ]]
        },
        hatchet: {
            w: 11, h: 8, band: [0.04, 0.18], speed: [0.10, 0.24],
            bob: [0.04, 0.09], flap: 4, rush: 3.4,
            frames: [[
                ".##########",
                "#..########",
                "##.########",
                "#..######.#",
                ".##########",
                ".##########",
                "..########.",
                "...######.."
            ], [
                ".##########",
                "...########",
                "#..########",
                "##.######.#",
                "#.#########",
                ".##########",
                "..########.",
                "...######.."
            ]]
        },
        danio: {
            shoal: true, bobAmp: 1,
            w: 14, h: 6, band: [0.06, 0.34], speed: [0.30, 0.52],
            bob: [0.08, 0.16], flap: 3, rush: 4.6,
            frames: [[
                "......####....",
                "#...##########",
                "##.###########",
                "###########.##",
                "##.###########",
                "#...##########"
            ], [
                "......####....",
                "....##########",
                "#..###########",
                "###########.##",
                "#..###########",
                "....##########"
            ]]
        },
        discus: {
            w: 18, h: 15, band: [0.22, 0.55], speed: [0.05, 0.12],
            bob: [0.03, 0.06], flap: 7, rush: 2.8,
            frames: [[
                ".......####.......",
                ".....########.....",
                "....##########....",
                "...############...",
                "..#############...",
                "..##############..",
                "#.###############.",
                "##############.###",
                "#.###############.",
                "..##############..",
                "..#############...",
                "...############...",
                "....##########....",
                ".....########.....",
                ".......####......."
            ], [
                ".......####.......",
                ".....########.....",
                "....##########....",
                "..#############...",
                "..##############..",
                ".###############..",
                "#.###############.",
                ".#############.###",
                "#.###############.",
                ".###############..",
                "..##############..",
                "..#############...",
                "....##########....",
                ".....########.....",
                ".......####......."
            ]]
        },
        angel: {
            tone: ANGEL,
            w: 15, h: 21, band: [0.20, 0.52], speed: [0.06, 0.14],
            bob: [0.03, 0.07], flap: 6, rush: 3.0,
            frames: [[
                "#..............",
                ".#.............",
                ".##............",
                "..##...........",
                "..####.........",
                "..#####........",
                ".########......",
                ".##########....",
                "############...",
                "##############.",
                "###############",
                "###########.###",
                "###############",
                "##############.",
                "############...",
                ".##########....",
                ".########......",
                "..#####........",
                "..####.........",
                ".##............",
                "#.............."
            ], [
                ".#.............",
                ".##............",
                "..##...........",
                "..###..........",
                "..#####........",
                ".#######.......",
                ".#########.....",
                "###########....",
                "#############..",
                "##############.",
                "###############",
                "###########.###",
                "###############",
                "##############.",
                "#############..",
                "###########....",
                ".#########.....",
                ".#######.......",
                "..#####........",
                "..###..........",
                ".#............."
            ]]
        },
    };

    // Bottom dwellers: they crawl on the substrate rather than swim.
    var CRITTERS = {
        pleco: {
            w: 20, h: 9, speed: [0.04, 0.10], flap: 9, rush: 5,
            frames: [[
                "........#####.......",
                ".......#######......",
                "#.....##############",
                "##...###############",
                "###.################",
                "#################.##",
                "###.################",
                "##...###############",
                "#.....#####...###..."
            ], [
                ".......#####........",
                "......#######.......",
                "#....###############",
                "##..################",
                "###.################",
                "#################.##",
                "###.################",
                "##..################",
                "#....###..#####....."
            ]]
        },
        snail: {
            w: 9, h: 6, speed: [0.015, 0.035], flap: 20, rush: 14,
            hides: true,
            frames: [[
                "..###....",
                ".#####.#.",
                "##.###.#.",
                "###.#####",
                "#########",
                ".########"
            ], [
                "..###....",
                ".#####.#.",
                "##.###..#",
                "###.#####",
                "#########",
                "..#######"
            ]],
            // Pulled into the shell: stalks gone, foot tucked up.
            hidden: [
                "..###....",
                ".#####...",
                "##.###...",
                "###.####.",
                "#######..",
                ".######.."
            ]
        },
    };

    // Rocks are generated per drop: ragged ellipses, a little smaller than a fish.
    function makeRock() {
        var w = irand(7, 10), h = irand(5, 7);
        var rows = [], cx = w / 2, cy = h / 2;
        for (var r = 0; r < h; r++) {
            var dy = (r + 0.5 - cy) / cy;
            var hw = cx * Math.sqrt(Math.max(0, 1 - dy * dy)) + rand(-0.7, 0.7);
            var line = '';
            for (var c = 0; c < w; c++) {
                line += Math.abs(c + 0.5 - cx) <= hw ? '#' : '.';
            }
            rows.push(line);
        }

        // Per-column surface profile, so rocks rest on each other's actual
        // shape rather than on their bounding boxes.
        var top = [], bottom = [];
        for (var c = 0; c < w; c++) {
            top[c] = -1;
            bottom[c] = -1;
            for (var y = 0; y < h; y++) {
                if (rows[y].charAt(c) === '#') {
                    if (top[c] < 0) top[c] = y;
                    bottom[c] = y;
                }
            }
        }
        return { rows: rows, w: w, h: h, top: top, bottom: bottom, dig: Math.max(1, Math.min(2, h - 4)) };
    }

    var fish = [], critters = [], plants = [], gravel = [], bubbles = [];
    var rocks = [], falling = [];
    var nextRock = 0, disturb = 0, disturbX = 0;
    var splash = null;   // ripple spreading from where a rock broke the surface

    // A new fish arrives the way it does from a shop: floating in a tied bag,
    // acclimatising at the surface before it is let out.
    var BAG = [
        ".....................###....................",
        "..................##.#.#.##.................",
        "..................####.####.................",
        "...................#.....#..................",
        ".................###.....###................",
        "...............###.........###..............",
        ".............###.............###............",
        "...........###.................###..........",
        "........####.....................####.......",
        "......###...........................###.....",
        "....###...............................###...",
        "..###...................................###.",
        "..#.......................................#.",
        "..#.......................................#.",
        "..#.......................................#.",
        "..#.......................................#.",
        "..#.......................................#.",
        "..#.......................................#.",
        "..#.......................................#.",
        "..#.......................................#.",
        "..#.......................................#.",
        "..#.......................................#.",
        "..#.......................................#.",
        "..#.......................................#.",
        "..#.......................................#.",
        "..#.......................................#.",
        "..#.......................................#.",
        "..#.......................................#.",
        "..#.......................................#.",
        "..#.......................................#.",
        "..#.......................................#.",
        "..#.......................................#.",
        "..#.......................................#.",
        "..#.......................................#.",
        "..#.......................................#.",
        "..#.......................................#.",
        "..#.......................................#.",
        "..#.......................................#.",
        "..#.......................................#.",
        "...#.....................................#..",
        "...###.................................###..",
        ".....###.............................###....",
        ".......####.......................####......",
        "..........####.................####.........",
        ".............#####.........#####............",
        ".................###########................"
    ];
    var bag = null;
    var BAG_MS = 45000;

    var FIRST_ROCK_MS = 8000;
    var ROCK_GAP_MS = [30000, 120000];

    function resize() {
        var dpr = Math.min(window.devicePixelRatio || 1, 3);
        var w = Math.floor(canvas.clientWidth * dpr);
        var h = Math.floor(canvas.clientHeight * dpr);
        canvas.width = w;
        canvas.height = h;

        var targetCols = canvas.clientWidth < 640 ? 115 : 215;
        CELL = Math.max(3, Math.round(w / targetCols));
        COLS = Math.floor(w / CELL);
        ROWS = Math.floor(h / CELL);
        OX = Math.floor((w - COLS * CELL) / 2);
        OY = Math.floor((h - ROWS * CELL) / 2);
        FLOOR = ROWS - BED;
        WATER = AIR;
        SWIM_FLOOR = FLOOR - Math.max(8, Math.round(ROWS * 0.09));
        build();
    }

    function build() {
        var small = COLS < 140;
        var i;

        gravel = [];
        for (var c = 0; c < COLS; c++) {
            if (Math.random() < 0.30) gravel.push([c, FLOOR - 1]);
        }

        plants = [];
        var pCount = 4;
        for (i = 0; i < pCount; i++) {
            var px0 = Math.round((i + rand(0.28, 0.72)) * (COLS / pCount));
            px0 = Math.max(2, Math.min(COLS - 12, px0));
            var blades = 2;
            for (var b = 0; b < blades; b++) {
                plants.push({
                    x: px0 + b * irand(4, 7),
                    h: irand(Math.round(ROWS * 0.09), Math.round(ROWS * 0.17)),
                    phase: rand(0, Math.PI * 2),
                    speed: rand(0.03, 0.055),
                    waves: rand(2.4, 4.0),
                    bend: rand(1.5, 2.6)
                });
            }
        }

        fish = [];
        var schoolPace = {}, schoolSpot = {};
        var roster = small
            ? ['tetra', 'tetra', 'tetra', 'angel', 'discus', 'danio', 'danio']
            : ['tetra', 'tetra', 'tetra', 'tetra', 'tetra', 'hatchet', 'angel', 'discus',
               'danio', 'danio'];
        for (i = 0; i < roster.length; i++) {
            var sp = SPECIES[roster[i]];
            if (sp.shoal && !schoolPace[roster[i]]) {
                schoolPace[roster[i]] = rand(sp.speed[0], sp.speed[1]);
                // The shoal starts as a shoal, gathered around one spot.
                schoolSpot[roster[i]] = {
                    x: rand(COLS * 0.2, COLS * 0.8),
                    y: rand(ROWS * sp.band[0] + 4, ROWS * sp.band[1] - 4)
                };
            }
            var pace = sp.shoal ? schoolPace[roster[i]] * rand(0.92, 1.08)
                                : rand(sp.speed[0], sp.speed[1]);
            var spot = schoolSpot[roster[i]];
            var spawnY = spot ? Math.round(spot.y + rand(-10, 10))
                              : Math.round(rand(ROWS * sp.band[0], ROWS * sp.band[1]));
            var spawnX = spot ? spot.x + rand(-30, 30)
                              : rand(2, Math.max(3, COLS - sp.w - 2));
            for (var tries = 0; tries < 24; tries++) {
                var clash = false;
                for (var q = 0; q < fish.length; q++) {
                    var o = fish[q];
                    if (spawnX + sp.w + 4 > o.x && o.x + o.sp.w + 4 > spawnX &&
                        spawnY + sp.h + 3 > o.y && o.y + o.sp.h + 3 > spawnY) { clash = true; break; }
                }
                if (!clash) break;
                spawnX = spot ? spot.x + rand(-24, 24)
                              : rand(2, Math.max(3, COLS - sp.w - 2));
                spawnY = spot ? Math.round(spot.y + rand(-9, 9))
                              : Math.round(rand(ROWS * sp.band[0], ROWS * sp.band[1]));
            }
            fish.push({
                sp: sp,
                x: Math.max(2, Math.min(COLS - sp.w - 2, spawnX)),
                y: Math.max(2, Math.min(ROWS * sp.band[1], spawnY)),
                drawY: spawnY,
                dir: Math.random() < 0.5 ? -1 : 1,
                speed: pace,
                phase: rand(0, Math.PI * 2),
                bob: rand(sp.bob[0], sp.bob[1]),
                dart: 0,
                flee: 0,
                fleeT: 0,
                turnLock: 0
            });
        }

        rocks = [];
        bag = null;
        for (i = 0; i < fish.length; i++) {
            if (fish[i].sp !== SPECIES.angel) continue;
            var side = Math.random() < 0.5 ? 1 : -1;
            bag = {
                fish: fish[i],
                w: BAG[0].length,
                h: BAG.length,
                x: side < 0 ? 8 : COLS - BAG[0].length - 8,
                drift: -side,
                phase: rand(0, Math.PI * 2),
                state: 'float', tipT: 0, tipDir: 1, lift: 0,
                theta: 0.12, omega: 0.03,   // tilt, and how fast it is rolling
                bobY: 0, bobV: 0,
                fx: 6, fvx: 0.25,           // where the fish is inside the bag
                fy: 1, fvy: 0.12,
                until: tick + Math.round(BAG_MS / STEP)
            };
            fish[i].bagged = true;
            break;
        }

        // Nudge anyone who happened to spawn where the bag is floating.
        if (bag) {
            for (i = 0; i < fish.length; i++) {
                var occupant = fish[i];
                if (occupant.bagged) continue;
                var guard = 0;
                while (guard++ < 60 && bagHit(occupant.x, occupant.drawY, occupant.sp.w, occupant.sp.h)) {
                    occupant.x += (occupant.x + occupant.sp.w / 2 < bag.x + bag.w / 2) ? -1 : 1;
                    occupant.x = Math.max(1, Math.min(COLS - 1 - occupant.sp.w, occupant.x));
                }
            }
        }

        critters = [];
        var kinds = ['snail', 'pleco'];
        CRAWL_CLEAR = 2;
        for (i = 0; i < kinds.length; i++) CRAWL_CLEAR = Math.max(CRAWL_CLEAR, CRITTERS[kinds[i]].h + 1);
        for (i = 0; i < kinds.length; i++) {
            var cs = CRITTERS[kinds[i]];
            critters.push({
                kind: kinds[i],
                sp: cs,
                x: rand(4, Math.max(5, COLS - cs.w - 4)),
                y: FLOOR - cs.h,
                dir: Math.random() < 0.5 ? -1 : 1,
                speed: rand(cs.speed[0], cs.speed[1]),
                phase: rand(0, Math.PI * 2),
                hideT: 0,
                dartT: 0,
                turnLock: 0
            });
        }

        bubbles = [];
        falling = [];
        disturb = 0;
        nextRock = tick + Math.round(FIRST_ROCK_MS / STEP);
    }

    // ---------- grid drawing ----------
    function px(cx, cy) {
        if (cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS) return;
        ctx.fillRect(OX + cx * CELL, OY + cy * CELL, CELL, CELL);
    }

    // Each creature is stamped with a one-cell white gap around it, so
    // overlapping black silhouettes never fuse into a blob.
    function stamp(cells, tone) {
        ctx.fillStyle = BG;
        for (var i = 0; i < cells.length; i += 2) {
            for (var dy = -1; dy <= 1; dy++) {
                for (var dx = -1; dx <= 1; dx++) px(cells[i] + dx, cells[i + 1] + dy);
            }
        }
        ctx.fillStyle = tone || INK;
        for (var j = 0; j < cells.length; j += 2) px(cells[j], cells[j + 1]);
    }

    function spriteCells(out, rows, x, y, flip) {
        var w = rows[0].length;
        for (var r = 0; r < rows.length; r++) {
            var line = rows[r];
            for (var c = 0; c < w; c++) {
                if (line.charAt(c) === '#') out.push(x + (flip ? w - 1 - c : c), y + r);
            }
        }
    }

    function drawPlant(p, t) {
        var baseY = FLOOR - 1;
        var cells = [];
        for (var k = 0; k < p.h; k++) {
            var u = k / p.h;
            var root = Math.min(1, k / 3);
            var shake = 0;
            if (disturb > 0 && Math.abs(p.x - disturbX) < 32) {
                shake = Math.sin(t * 0.8 + p.phase) * (disturb / 26) * 2.2 * u;
            }
            var off = Math.round(Math.sin(p.phase + u * p.waves + t * p.speed) * p.bend * root + shake);
            var w = u < 0.45 ? 3 : (u < 0.85 ? 2 : 1);
            for (var i = 0; i < w; i++) cells.push(p.x + off + i, baseY - k);
        }
        stamp(cells);
    }

    // The ground under a critter's footprint: the substrate, or the top of
    // whatever rock it is walking over.
    function groundUnder(x, w) {
        var top = FLOOR;
        for (var c = x; c < x + w; c++) {
            var surf = surfaceAt(c);
            if (surf < top) top = surf;
        }
        return top;
    }

    function updateCritters(t) {
        for (var i = 0; i < critters.length; i++) {
            var c = critters[i];
            if (c.dartT > 0) c.dartT--;

            {
                if (c.hideT > 0 && c.dartT <= 0) {
                    c.hideT--;
                } else {
                    c.x += c.dir * c.speed * (c.dartT > 0 ? c.sp.rush : 1);
                    if (c.x < 1) { c.x = 1; c.dir = 1; }
                    if (c.x + c.sp.w > COLS - 1) { c.x = COLS - 1 - c.sp.w; c.dir = -1; }
                }

                // Climb over rocks and wood a row at a time.
                var target = groundUnder(Math.round(c.x), c.sp.w) - c.sp.h;
                if (c.y > target) c.y -= 1;
                else if (c.y < target) c.y += Math.min(2, target - c.y);
            }

            var cells = [];
            {
                var rows;
                if (c.hideT > 0 && c.dartT <= 0 && c.sp.hidden) rows = c.sp.hidden;
                else rows = c.sp.frames[Math.floor(t / (c.dartT > 0 ? 2 : c.sp.flap) + c.phase * 3) % 2];
                spriteCells(cells, rows, Math.round(c.x), Math.round(c.y), c.dir < 0);
            }
            stamp(cells);
        }
    }

    function drawFish(f, t) {
        var frame = Math.floor(t / (f.dart > 0 ? 2 : f.sp.flap) + f.phase * 3) % 2;
        var cells = [];
        spriteCells(cells, f.sp.frames[frame], Math.round(f.x), f.drawY, f.dir < 0);
        stamp(cells, f.sp.tone);
    }

    // ---------- rocks ----------
    function bubbleAt(x, y, rate) {
        bubbles.push({ x: x, y: y, rate: rate, phase: rand(0, Math.PI * 2) });
    }

    // Where a rock dropped at column x comes to rest: on the substrate, or
    // stacked on top of whatever landed there before.
    // Height of the pile's surface in column c (ROWS when nothing is there).
    function surfaceAt(c, skip, dig) {
        var top = FLOOR + (dig || 0);
        for (var i = 0; i < rocks.length; i++) {
            var r = rocks[i];
            if (r === skip || c < r.x || c >= r.x + r.w) continue;
            var t = r.top[c - r.x];
            if (t >= 0 && r.y + t < top) top = r.y + t;
        }
        return top;
    }

    function restingRow(shape, x, skip) {
        var row = FLOOR;
        for (var c = 0; c < shape.w; c++) {
            if (shape.bottom[c] < 0) continue;
            var candidate = surfaceAt(x + c, skip, shape.dig) - 1 - shape.bottom[c] + EMBED;
            if (candidate < row) row = candidate;
        }
        return row;
    }

    // What a rock at (x, y) is actually resting on: which of its bottom
    // columns touch the top of a rock below. A wide, centred contact holds;
    // anything perched on a rounded shoulder rolls off.
    function supportInfo(shape, x, y) {
        var lo = -1, hi = -1, touches = 0, onFloor = false;
        for (var c = 0; c < shape.w; c++) {
            if (shape.bottom[c] < 0) continue;
            var surf = surfaceAt(x + c);
            if (y + shape.bottom[c] + 1 - EMBED === surf) {
                if (lo < 0) lo = x + c;
                hi = x + c;
                touches++;
                if (surf >= FLOOR) onFloor = true;
            }
        }

        if (onFloor) return { stable: true };
        if (!touches) return { stable: false, roll: Math.random() < 0.5 ? -1 : 1 };

        var cx = x + shape.w / 2;
        var wide = touches >= Math.max(3, Math.ceil(shape.w * 0.8));
        var span = (hi + 1) - lo;
        var centred = cx >= lo + span * 0.25 && cx <= hi + 1 - span * 0.25;
        if (wide && centred) return { stable: true };
        return { stable: false, roll: cx < (lo + hi + 1) / 2 ? -1 : 1 };
    }

    // A landed rock is solid: fish turn around at it rather than swimming through.
    function blockedBy(x, y, fw, fh) {
        for (var i = 0; i < rocks.length; i++) {
            var r = rocks[i];
            if (x + fw > r.x && r.x + r.w > x && y + fh > r.y && r.y + r.h > y) return true;
        }
        return false;
    }

    // Fish keep out of each other's way: no swimming through a neighbour.
    function fishHit(self, x, y) {
        for (var i = 0; i < fish.length; i++) {
            var g = fish[i];
            if (g === self) continue;
            if (x + self.sp.w > g.x && g.x + g.sp.w > x &&
                y + self.sp.h > g.drawY && g.drawY + g.sp.h > y) return true;
        }
        return false;
    }

    // The floating bag is solid: fish cannot swim through or behind it.
    function bagTop() {
        return WATER - 12 + Math.round(bag.bobY - bag.lift);
    }

    function bagHit(x, y, w, h) {
        if (!bag) return false;
        var by = bagTop();
        if (y + h <= by || y >= by + bag.h) return false;
        var mid = bag.h / 2;
        var r0 = Math.max(0, y - by), r1 = Math.min(bag.h, y + h - by);
        for (var r = r0; r < r1; r++) {
            var row = BAG[r];
            var left = row.indexOf('#');
            if (left < 0) continue;
            var right = row.lastIndexOf('#');
            var shift = Math.round((r - mid) * bag.theta);
            if (x + w > bag.x + left + shift && bag.x + right + shift >= x) return true;
        }
        return false;
    }

    // Crawlers on the rocks are obstacles too, not just scenery.
    function critterHit(x, y, w, h) {
        for (var i = 0; i < critters.length; i++) {
            var c = critters[i];
            if (x + w > c.x && c.x + c.sp.w > x &&
                y + h > c.y && c.y + c.sp.h > y) return true;
        }
        return false;
    }

    // How crowded a fish feels, as a direction to ease away in.
    function personalSpace(f) {
        var sx = 0, sy = 0, near = false;
        for (var i = 0; i < fish.length; i++) {
            var g = fish[i];
            if (g === f) continue;
            var dx = (f.x + f.sp.w / 2) - (g.x + g.sp.w / 2);
            var dy = (f.drawY + f.sp.h / 2) - (g.drawY + g.sp.h / 2);
            if (Math.abs(dx) < (f.sp.w + g.sp.w) / 2 + 13 &&
                Math.abs(dy) < (f.sp.h + g.sp.h) / 2 + 9) {
                near = true;
                sx += dx >= 0 ? 1 : -1;
                sy += dy >= 0 ? 1 : -1;
            }
        }
        return near ? { x: sx, y: sy } : null;
    }

    // A fish bolts away from (rx, ry): horizontally first, with a vertical
    // kick so the whole tank visibly scatters.
    function startle(f, rx, ry, power) {
        var dx = (f.x + f.sp.w / 2) - rx;
        var dy = (f.drawY + f.sp.h / 2) - ry;
        // Directly underneath, keep going rather than flip-flopping each tick.
        if (Math.abs(dx) > 3) f.dir = dx >= 0 ? 1 : -1;
        if (Math.abs(dy) > 2) f.flee = dy >= 0 ? 1 : -1;
        f.dart = Math.max(f.dart, power);
        f.fleeT = Math.max(f.fleeT, power);
    }

    // The snail pulls into its shell; the shrimp flicks away backwards.
    function spook(c, rx, power) {
        var dx = (c.x + c.sp.w / 2) - rx;
        if (Math.abs(dx) > 3) c.dir = dx >= 0 ? 1 : -1;
        c.dartT = Math.max(c.dartT, c.sp.hides ? 12 : power);
        // Snails bolt a little way first, then pull into the shell.
        if (c.sp.hides) c.hideT = Math.max(c.hideT, power * 2);
    }

    function dropRock() {
        var shape = makeRock();
        var x = irand(4, Math.max(5, COLS - shape.w - 4));
        falling.push({ x: x, y: -shape.h, vy: 0.7, rows: shape.rows, w: shape.w, h: shape.h, top: shape.top, bottom: shape.bottom, dig: shape.dig });

        // The splash startles the whole tank; fish near it bolt hardest.
        for (var i = 0; i < fish.length; i++) {
            var f = fish[i];
            startle(f, x + shape.w / 2, 0, Math.abs((f.x + f.sp.w / 2) - x) < 60 ? 26 : 14);
        }
        for (var cc = 0; cc < critters.length; cc++) spook(critters[cc], x + shape.w / 2, 14);

        disturb = 18;
        disturbX = x;
        splash = { x: x + shape.w / 2, t0: tick };
        if (bag) {
            var away = (bag.x + bag.w / 2) - x;
            bag.omega += (away >= 0 ? 1 : -1) * 0.16;
            bag.bobV += 0.6;
        }
        for (var b = 0; b < 22; b++) {
            bubbleAt(x + shape.w / 2 + irand(-5, 5), WATER + irand(1, 9), irand(1, 4));
        }
    }

    function updateRocks(t) {
        if (tick >= nextRock) {
            dropRock();
            nextRock = tick + Math.round(rand(ROCK_GAP_MS[0], ROCK_GAP_MS[1]) / STEP);
        }

        for (var i = falling.length - 1; i >= 0; i--) {
            var r = falling[i];
            r.vy = Math.min(5.5, r.vy + 0.5);
            r.y += r.vy;

            if (r.y > WATER) {
                bubbleAt(Math.round(r.x) + irand(0, r.w), Math.round(r.y) + irand(0, 2), irand(1, 4));
                if (tick % 2 === 0) bubbleAt(Math.round(r.x) + irand(0, r.w), Math.round(r.y), irand(2, 4));
            }

            // Anything the rock plunges past scatters out of its way.
            var rcx = r.x + r.w / 2, rcy = r.y + r.h / 2;
            for (var q = 0; q < fish.length; q++) {
                var ff2 = fish[q];
                var ddx = (ff2.x + ff2.sp.w / 2) - rcx, ddy = (ff2.drawY + ff2.sp.h / 2) - rcy;
                if (Math.abs(ddx) < 42 && Math.abs(ddy) < 32) startle(ff2, rcx, rcy, 24);
            }
            if (r.y > ROWS * 0.5) {
                for (var cq = 0; cq < critters.length; cq++) {
                    var cr = critters[cq];
                    if (Math.abs((cr.x + cr.sp.w / 2) - rcx) < 40) spook(cr, rcx, 20);
                }
            }

            var rest = restingRow(r, Math.round(r.x));
            if (r.y >= rest) {
                // It has met something. Does it sit, or roll off the shoulder?
                var rx0 = Math.round(r.x);
                r.rolls = r.rolls || 0;
                var sup = supportInfo(r, rx0, rest);
                var reversing = 0;

                // Angle of repose: even a well-seated stone slides on if the
                // ground close by is a good deal lower.
                var slideDir = 0, bestDrop = 2;
                for (var d = -1; d <= 1; d += 2) {
                    for (var look = 1; look <= 14; look++) {
                        var tx = rx0 + d * look;
                        if (tx < 0 || tx + r.w > COLS) break;
                        var drop = restingRow(r, tx) - rest;
                        if (drop > bestDrop) { bestDrop = drop; slideDir = d; }
                    }
                }

                var roll = slideDir || (sup.stable ? 0 : sup.roll);
                if (roll && r.rolls < 40) {
                    // Never roll back the way we came, or it shivers in place.
                    reversing = r.lastRoll && r.lastRoll === -roll;
                    var nx = rx0 + roll;
                    if (nx >= 0 && nx + r.w <= COLS && !reversing) {
                        r.y = rest;
                        r.x = nx;
                        r.vy = 0.6;
                        r.lastRoll = roll;
                        r.rolls++;
                        continue;
                    }
                }

                falling.splice(i, 1);
                rocks.push({ x: Math.round(r.x), y: rest, w: r.w, h: r.h, rows: r.rows, top: r.top, bottom: r.bottom, dig: r.dig });
                if (rocks.length > 26) dropOldestRock();
                disturb = 26;
                disturbX = Math.round(r.x);
                for (var m = 0; m < fish.length; m++) {
                    var ff = fish[m];
                    if (Math.abs((ff.x + ff.sp.w / 2) - r.x) < 50) startle(ff, r.x + r.w / 2, rest, 24);
                }
                for (var cm = 0; cm < critters.length; cm++) spook(critters[cm], r.x + r.w / 2, 22);
                for (var k = 0; k < 9; k++) {
                    bubbleAt(Math.round(r.x) + irand(-2, r.w + 2), rest - irand(0, 3), irand(2, 4));
                }
            }
        }

        if (disturb > 0) disturb--;
    }

    // Retire the oldest rock that nothing is resting on, so a pile never
    // loses the rock holding it up.
    // Is o resting on r? (Their surfaces touch in at least one column.)
    function restsOn(o, r) {
        for (var c = 0; c < o.w; c++) {
            if (o.bottom[c] < 0) continue;
            var k = (o.x + c) - r.x;
            if (k < 0 || k >= r.w || r.top[k] < 0) continue;
            if (o.y + o.bottom[c] + 1 === r.y + r.top[k]) return true;
        }
        return false;
    }

    function dropOldestRock() {
        for (var i = 0; i < rocks.length; i++) {
            var r = rocks[i], held = false;
            if (r.fixed) continue;
            for (var j = 0; j < rocks.length; j++) {
                if (rocks[j] !== r && restsOn(rocks[j], r)) { held = true; break; }
            }
            if (!held) { rocks.splice(i, 1); settlePile(); return; }
        }
        for (var q = 0; q < rocks.length; q++) {
            if (!rocks[q].fixed) { rocks.splice(q, 1); break; }
        }
        settlePile();
    }

    // Anything left hanging after a rock is removed falls again.
    function settlePile() {
        for (var i = rocks.length - 1; i >= 0; i--) {
            var r = rocks[i];
            if (r.fixed) continue;
            if (r.y < restingRow(r, r.x, r)) {
                rocks.splice(i, 1);
                falling.push({ x: r.x, y: r.y, vy: 0.5, rows: r.rows, w: r.w, h: r.h,
                               top: r.top, bottom: r.bottom, dig: r.dig, rolls: 0 });
            }
        }
    }

    // ---------- loop ----------
    var tick = 0, last = 0;
    var STEP = 140; // ms per animation step -> chunky, pixel-art timing

    function frame(now) {
        requestAnimationFrame(frame);
        if (now - last < STEP) return;
        last = now;
        tick++;
        var t = tick;
        var i;

        ctx.fillStyle = BG;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = INK;

        ctx.fillStyle = INK;
        for (i = 0; i < plants.length; i++) drawPlant(plants[i], t);
        updateRocks(t);
        // Stamped as one mass, so touching stones meld instead of each
        // carving a white outline into its neighbour.
        var rockCells = [];
        for (i = 0; i < rocks.length; i++) {
            spriteCells(rockCells, rocks[i].rows, rocks[i].x, rocks[i].y, false);
        }
        for (i = 0; i < falling.length; i++) {
            spriteCells(rockCells, falling[i].rows, Math.round(falling[i].x), Math.round(falling[i].y), false);
        }
        stamp(rockCells, STONE);

        updateCritters(t);

        // Every so often the substrate lets a bubble go.
        if (Math.random() < 0.02 && bubbles.length < 60) {
            var bx = irand(2, COLS - 3);
            var by = groundUnder(bx, 1) - 1;
            bubbleAt(bx, by, irand(2, 4));
            if (Math.random() < 0.5) bubbleAt(bx + irand(-1, 1), by - irand(1, 3), irand(2, 4));
        }
        ctx.fillStyle = INK;
        for (i = bubbles.length - 1; i >= 0; i--) {
            var b = bubbles[i];
            if (tick % b.rate === 0) b.y -= 1;
            if (b.y <= WATER + 1) bubbles.splice(i, 1);
            else px(b.x + (Math.sin(t * 0.4 + b.phase) > 0 ? 0 : 1), b.y);
        }

        for (i = 0; i < fish.length; i++) {
            var f = fish[i];
            if (f.bagged) continue;   // riding in the bag, drawn with it
            var fw = f.sp.w, fh = f.sp.h;
            if (f.dart > 0) f.dart--;
            // The substrate is the floor: never let a fish dip into it.
            // Stay clear of the bed, and of anything crawling on the pile below.
            var maxDrawY = Math.min(SWIM_FLOOR, groundUnder(Math.round(f.x), fw) - CRAWL_CLEAR) - fh;
            f.drawY = Math.min(maxDrawY, Math.round(f.y + Math.sin(t * f.bob + f.phase) * (f.sp.bobAmp || 2)));

            // Lift clear immediately if a rock came to rest on top of a fish.
            for (var esc = 0; esc < 12 && blockedBy(f.x, f.drawY, fw, fh); esc++) { f.y -= 1; f.drawY -= 1; }
            // ... and duck away downward if the drifting bag catches one.
            if (bagHit(f.x, f.drawY, fw, fh)) {
                var out = (f.x + fw / 2 < bag.x + bag.w / 2) ? -1 : 1;
                f.x += out;
                f.dir = out;
                f.turnLock = 6;
                if (f.drawY < bagTop() + bag.h) { f.y += 0.5; f.drawY = Math.round(f.y); }
            }

            if (f.sp.shoal && f.dart <= 0) {
                var n = 0, sumY = 0, vote = 0, nearestDx = null;
                for (var k = 0; k < fish.length; k++) {
                    var g = fish[k];
                    if (g === f || g.sp !== f.sp) continue;
                    var gdx = (g.x + g.sp.w / 2) - (f.x + f.sp.w / 2);
                    if (nearestDx === null || Math.abs(gdx) < Math.abs(nearestDx)) nearestDx = gdx;
                    if (Math.abs(gdx) < 85 && Math.abs(g.drawY - f.drawY) < 34) {
                        n++;
                        sumY += g.y;
                        vote += g.dir;
                    }
                }
                if (n > 0) {
                    if (tick % 5 === 0 && vote !== 0) {
                        var want = vote > 0 ? 1 : -1;
                        // Fall back in with the group even if we just turned to
                        // dodge someone -- as long as that way is actually clear.
                        var probe = f.x + want * f.speed;
                        if (want !== f.dir && !blockedBy(probe, f.drawY, f.sp.w, f.sp.h) &&
                            !fishHit(f, probe, f.drawY) && !critterHit(probe, f.drawY, f.sp.w, f.sp.h) &&
                            !bagHit(probe, f.drawY, f.sp.w, f.sp.h) &&
                            probe > 1 && probe + f.sp.w < COLS - 1) {
                            f.dir = want;
                            f.turnLock = 4;
                        }
                    }
                    var meanY = sumY / n;
                    if (Math.abs(meanY - f.y) > 13) {
                        var cy = f.y + (meanY > f.y ? 0.22 : -0.22);
                        var cDraw = Math.round(cy + Math.sin(t * f.bob + f.phase) * (f.sp.bobAmp || 2));
                        if (!blockedBy(f.x, cDraw, fw, fh) && !critterHit(f.x, cDraw, fw, fh) &&
                            !bagHit(f.x, cDraw, fw, fh) && !fishHit(f, f.x, cDraw)) f.y = cy;
                    }
                } else if (nearestDx !== null && tick % 12 === 0 && f.turnLock <= 0) {
                    f.dir = nearestDx >= 0 ? 1 : -1;   // strayed: head back to the school
                    f.turnLock = 6;
                }
            }

            if (f.turnLock > 0) f.turnLock--;
            var rush = f.dart > 0 ? f.sp.rush : 1;
            if (f.sp.shoal && f.dart <= 0) {
                // Ease off rather than crowd the fish in front.
                for (var m = 0; m < fish.length; m++) {
                    var ahead = fish[m];
                    if (ahead === f || ahead.sp !== f.sp) continue;
                    var gap = (ahead.x - f.x) * f.dir;
                    if (gap > 0 && gap < f.sp.w + 8 && Math.abs(ahead.drawY - f.drawY) < 8) {
                        rush *= 0.55;
                        break;
                    }
                }
            }
            var space = personalSpace(f);
            var tangled = fishHit(f, f.x, f.drawY);
            var step = f.dir * f.speed * rush;

            if (tangled && space) {
                // Already sharing a space: head straight out of it.
                f.dir = space.x >= 0 ? 1 : -1;
                step = f.dir * f.speed * rush;
                if (blockedBy(f.x + step, f.drawY, fw, fh)) step = 0;
            } else if (blockedBy(f.x + step, f.drawY, fw, fh) || fishHit(f, f.x + step, f.drawY) ||
                       critterHit(f.x + step, f.drawY, fw, fh) || bagHit(f.x + step, f.drawY, fw, fh)) {
                if (f.turnLock <= 0) { f.dir = -f.dir; f.turnLock = 12; }
                step = f.dir * f.speed * rush;
                if (blockedBy(f.x + step, f.drawY, fw, fh) || fishHit(f, f.x + step, f.drawY) ||
                    critterHit(f.x + step, f.drawY, fw, fh) || bagHit(f.x + step, f.drawY, fw, fh)) step = 0;
            }
            f.x += step;

            // Settle back into the depth this species keeps to.
            var bandTop = ROWS * f.sp.band[0], bandLow = ROWS * f.sp.band[1];
            if (!f.sp.shoal && (f.y < bandTop - 4 || f.y > bandLow + 4)) {
                var seek = f.y < bandTop ? 0.2 : -0.2;
                var ny2 = Math.max(WATER + 3, Math.min(maxDrawY - 2, f.y + seek));
                var nDraw2 = Math.round(ny2 + Math.sin(t * f.bob + f.phase) * (f.sp.bobAmp || 2));
                if (!blockedBy(f.x, nDraw2, fw, fh) && !critterHit(f.x, nDraw2, fw, fh) &&
                    !bagHit(f.x, nDraw2, fw, fh) && !fishHit(f, f.x, nDraw2)) f.y = ny2;
            }

            // Ease apart from a crowding neighbour, one notch at a time.
            if (space) {
                var lift = space.y >= 0 ? 0.7 : -0.7;
                var sy2 = Math.max(WATER + 3, Math.min(maxDrawY - 2, f.y + lift));
                var sDraw = Math.round(sy2 + Math.sin(t * f.bob + f.phase) * (f.sp.bobAmp || 2));
                if (!blockedBy(f.x, sDraw, fw, fh) && !critterHit(f.x, sDraw, fw, fh) &&
                    !bagHit(f.x, sDraw, fw, fh) &&
                    (tangled || !fishHit(f, f.x, sDraw))) f.y = sy2;
            }

            if (f.fleeT > 0) {
                f.fleeT--;
                var ny = Math.min(f.y + f.flee * 0.7, maxDrawY - 2);
                var nDraw = Math.round(ny + Math.sin(t * f.bob + f.phase) * (f.sp.bobAmp || 2));
                if (blockedBy(f.x, nDraw, fw, fh) || critterHit(f.x, nDraw, fw, fh) ||
                    bagHit(f.x, nDraw, fw, fh)) f.fleeT = 0;
                else f.y = ny;
            }
            f.y = Math.max(WATER + 3, Math.min(maxDrawY - 2, f.y));
            // The screen is the tank: fish turn at the glass instead of wrapping.
            if (f.x < 1) { f.x = 1; f.dir = 1; }
            if (f.x + fw > COLS - 1) { f.x = COLS - 1 - fw; f.dir = -1; }
            drawFish(f, t);
        }


        if (bag) {
            if (tick % 14 === 0) bag.x += bag.drift;
            if (bag.x < 7) { bag.x = 7; bag.drift = 1; }
            if (bag.x + bag.w > COLS - 7) { bag.x = COLS - 7 - bag.w; bag.drift = -1; }

            if (bag.state === 'float') {
                // Floating plastic: a damped roll and bob, nudged by the water.
                bag.omega += -0.05 * bag.theta - 0.07 * bag.omega + rand(-0.004, 0.004);
                bag.theta = Math.max(-0.42, Math.min(0.42, bag.theta + bag.omega));
                bag.bobV += -0.05 * bag.bobY - 0.09 * bag.bobV + rand(-0.03, 0.03);
                bag.bobY = Math.max(-2.5, Math.min(2.5, bag.bobY + bag.bobV));

                // the fish has room to swim in there
                var span = bag.w - 8 - bag.fish.sp.w;
                bag.fx += bag.fvx;
                if (bag.fx < 0) { bag.fx = 0; bag.fvx = Math.abs(bag.fvx); bag.fish.dir = 1; }
                if (bag.fx > span) { bag.fx = span; bag.fvx = -Math.abs(bag.fvx); bag.fish.dir = -1; }
                var drop = (bag.h - 4) - 13 - bag.fish.sp.h;
                bag.fy += bag.fvy;
                if (bag.fy < 0) { bag.fy = 0; bag.fvy = Math.abs(bag.fvy); }
                if (bag.fy > drop) { bag.fy = drop; bag.fvy = -Math.abs(bag.fvy); }

                if (tick >= bag.until) {
                    bag.state = 'tip';
                    bag.tipT = 0;
                    bag.tipDir = (bag.x + bag.w / 2 < COLS / 2) ? 1 : -1;
                }
            } else if (bag.state === 'tip') {
                // Tipped over so the fish can swim out of the mouth.
                bag.tipT++;
                bag.theta += (bag.tipDir * 1.0 - bag.theta) * 0.10;
                bag.bobY += (2 - bag.bobY) * 0.08;
                bag.fx = Math.max(0, Math.min(bag.w - 8 - bag.fish.sp.w,
                                              bag.fx + bag.tipDir * 0.7));
                bag.fy = Math.max(0, bag.fy - 0.35);

                if (bag.tipT === 18) {
                    var newcomer = bag.fish;
                    newcomer.bagged = false;
                    newcomer.x = bag.x + 4 + bag.fx;
                    newcomer.y = bagTop() + 13 + bag.fy;
                    newcomer.drawY = Math.round(newcomer.y);
                    newcomer.dir = bag.tipDir;
                    newcomer.flee = 1;          // slips downward out of the bag
                    newcomer.fleeT = 26;
                    newcomer.dart = 12;
                    splash = { x: bag.x + bag.w / 2, t0: tick };
                    for (var bb = 0; bb < 12; bb++) {
                        bubbleAt(Math.round(bag.x + bag.w / 2) + irand(-6, 6), WATER + irand(2, 10), irand(1, 4));
                    }
                }
                if (bag.tipT > 30) bag.state = 'lift';
            } else {
                // Lifted back out of the tank.
                bag.lift += 0.9;
                bag.theta *= 0.95;
                if (bagTop() + bag.h < 0) bag = null;
            }
        }

        drawSurface(t);
        if (bag) drawBag(t);
        drawBed();
    }

    // The waterline: a slow swell across the top of the tank.
    function drawSurface(t) {
        ctx.fillStyle = INK;
        var age = splash ? t - splash.t0 : -1;
        if (splash && age > 70) splash = null;

        for (var c = 0; c < COLS; c++) {
            var swell = 0;   // a tank sits flat until something disturbs it

            if (splash) {
                var d = Math.abs(c - splash.x);
                var fade = Math.max(0, 1 - age / 70);
                // Leading ring, and a slower one trailing behind it.
                var rel = d - age * 1.6;
                if (Math.abs(rel) < 7) swell += Math.cos(rel * 0.45) * 3.0 * fade;
                var rel2 = d - age * 0.85;
                if (Math.abs(rel2) < 6) swell += Math.cos(rel2 * 0.5) * 1.6 * fade;
                // The hole the stone punches, closing over as it fills.
                if (age < 7 && d < 5 - age * 0.6) swell += 3.5 - age * 0.4;
            }

            var y = WATER + Math.round(swell);
            px(c, y);
        }

        // Water thrown up as the stone goes under.
        if (splash && age < 6) {
            var spread = 2 + age;
            for (var k = -spread; k <= spread; k++) {
                if (Math.abs(k) < age - 1) continue;
                var hx = Math.round(splash.x + k);
                var hy = WATER - Math.round((spread - Math.abs(k)) * 0.8) - 1;
                px(hx, hy);
                if (Math.abs(k) < 2) px(hx, hy - 1);
            }
        }
    }

    function drawBag(t) {
        var x = Math.round(bag.x);
        var y = bagTop();                            // waterline crosses it
        var mid = bag.h / 2;

        // Leaning the sprite row by row is what reads as a roll.
        function lean(cells, originY) {
            for (var i = 0; i < cells.length; i += 2) {
                cells[i] += Math.round((cells[i + 1] - originY - mid) * bag.theta);
            }
            return cells;
        }

        var f = bag.fish;
        f.x = x + 4 + Math.round(bag.fx);
        f.drawY = y + 13 + Math.round(bag.fy);
        f.y = f.drawY;
        var inner = [];
        spriteCells(inner, f.sp.frames[Math.floor(t / f.sp.flap) % 2], f.x, f.drawY, f.dir < 0);
        stamp(lean(inner, y), f.sp.tone);

        var cells = [];
        spriteCells(cells, BAG, x, y, false);
        stamp(lean(cells, y), STONE);

        // the water it is half filled with, its level just above the tank's
        var lvl = y + 11;
        var row = BAG[lvl - y];
        var left = row.indexOf('#'), right = row.lastIndexOf('#');
        var water = [];
        for (var c = left + 1; c < right; c++) water.push(x + c, lvl);
        lean(water, y);
        ctx.fillStyle = INK;
        for (var q = 0; q < water.length; q += 2) px(water[q], water[q + 1]);
    }

    // Painted last: rocks settle into the gravel rather than floating on it,
    // and no sprite's white outline can nick the bed.
    function drawBed() {
        ctx.fillStyle = STONE;
        ctx.fillRect(OX, OY + FLOOR * CELL, COLS * CELL, BED * CELL);
        for (var i = 0; i < gravel.length; i++) px(gravel[i][0], gravel[i][1]);
    }

    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', resize);
    resize();
    requestAnimationFrame(frame);
})();
</script>
</body>
</html>
